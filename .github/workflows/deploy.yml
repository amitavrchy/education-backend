name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/amitavrchy/education-backend
  # Dummy URL: prisma.config.ts needs one for "prisma generate"; no database is used in CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (non-blocking)
        run: npm test
        continue-on-error: true
      - run: npm run build

  image:
    name: build & push image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            com.shikkhaai.image=api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE }}:migrate-${{ github.sha }}
            ${{ env.IMAGE }}:migrate-latest
          labels: |
            com.shikkhaai.image=migrate
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: http://178.105.160.150:8080/api/docs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload stack files
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes docker-compose.prod.yml "$TARGET:/opt/shikkhaai/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy/nginx.conf deploy/deploy.sh "$TARGET:/opt/shikkhaai/deploy/"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes docker/postgres/init/01-extensions.sql "$TARGET:/opt/shikkhaai/docker/postgres/init/"
      - name: Release
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$TARGET" \
            "bash /opt/shikkhaai/deploy/deploy.sh '${{ github.sha }}' '${{ github.actor }}'"
      - name: Smoke test
        run: curl -fsS -m 15 --retry 5 --retry-delay 3 "http://${{ secrets.VPS_HOST }}:8080/api/v1/health/ready"
      - if: always()
        run: rm -f ~/.ssh/deploy_key
